name: Validate DFIQ YAML

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Set up Python 3.11
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install
    - name: Validate DFIQ YAML
      run: |
        poetry run yamale -s dfiq/utils/scenario_spec.yaml ./dfiq/data/scenarios
        poetry run yamale -s dfiq/utils/facet_spec.yaml ./dfiq/data/facets
        poetry run yamale -s dfiq/utils/question_spec.yaml ./dfiq/data/questions
    - name: Run unit tests
      run: poetry run python -m unittest discover -s tests -v
